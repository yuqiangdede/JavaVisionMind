spring:
  application:
    name: rfdetr

server:
  port: 17011
  servlet:
    context-path: /vision-mind-rfdetr

vision-mind:
  resource:
    root: ./resource
    fallback-env: VISION_MIND_PATH
    validate-on-startup: true
    manifest: resource/manifest.json
  native-load:
    skip-open-cv: ${vision-mind.skip-opencv:false}
  rfdetr:
    model-path: rfdetr/model/rfdetr-small.onnx
    metadata-path: rfdetr/model/rfdetr-small.metadata.json
    threshold: 0.3
    default-types: 1,2,3,4,5,6,7,8,9
    detection-ratio: 0.5
    blocking-ratio: 0.5
    frame-interval: 5
    threads: 0
