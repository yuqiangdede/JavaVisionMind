spring:
  application:
    name: llm

server:
  port: 17005
  servlet:
    context-path: /vision-mind-llm

vision-mind:
  resource:
    root: ./resource
    fallback-env: VISION_MIND_PATH
    validate-on-startup: true
    manifest: resource/manifest.json
  native-load:
    skip-open-cv: ${vision-mind.skip-opencv:false}
  runtime:
    profile: default
  vector-store:
    mode: memory
  llm:
    ollama:
      base-url: ''
      model: ''
    openai:
      base-url: https://ark.cn-beijing.volces.com/api/v3/chat/completions
      api-key: ''
      model: ep-20250327212217-f57wv
    http-timeout-ms: 1000000
